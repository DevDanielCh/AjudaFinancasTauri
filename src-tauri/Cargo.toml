[package]
name = "ajudafinancas"
version = "0.1.6"
description = "Ajuda Finanças - gerenciador financeiro pessoal"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ajudafinancas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
tauri-plugin-log = "2"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite_migration = "2.6.0"
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-updater = "2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tauri-plugin-process = "2.3.1"

# Sync engine
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }
base64 = "0.22"

# Encryption
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
rand = "0.8"

# Hashing
sha2 = "0.10"

# Secure credential storage
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "windows-native"] }

# Async runtime (for sync network operations)
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "macros"] }

# Compression
flate2 = "1"

# Device info
hostname = "0.4"
dirs = "6"

# Async trait support
async-trait = "0.1"
dotenvy = "0.15.7"
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-safe-area-insets = "0.1"

